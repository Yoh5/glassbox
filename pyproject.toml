[project]
name = "glassbox"
version = "0.1.0"
description = "The flight recorder for AI agents: tamper-evident decision records, and the path from an action back to the byte that caused it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Axel AHO" }]
dependencies = []

[project.scripts]
glassbox = "glassbox.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

# Explicit, because setuptools' flat-layout discovery otherwise mistakes the
# recorded example runs for a package and refuses to build.
[tool.setuptools]
packages = ["glassbox"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
